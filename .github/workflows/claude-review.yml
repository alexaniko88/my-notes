name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

# A new push to the PR cancels the in-flight review of the outdated code
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # required by claude-code-action's OIDC token exchange

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the base branch is available to diff against

      - name: Read FVM-pinned Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      # The review skill prefixes commands with `fvm`, which doesn't exist on the
      # runner. The shim strips the prefix so `fvm flutter analyze` just works.
      - name: Shim fvm and get dependencies
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec "$@"\n' > "$HOME/.local/bin/fvm"
          chmod +x "$HOME/.local/bin/fvm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          flutter pub get

      - name: Run review skill
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request by following the project review skill at
            .claude/skills/review/SKILL.md exactly — its workflow, architecture
            rules, coding rules, severity levels, and output format. Compare the
            PR head against the base branch using origin/${{ github.base_ref }}
            in place of the skill's "master" reference.

            When the review is complete, post the full review report as a single
            comment on PR #${{ github.event.pull_request.number }} in
            ${{ github.repository }} using `gh pr comment`. The review is
            informative only — do not request changes or approve.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(fvm flutter analyze:*),Bash(flutter analyze:*),Bash(gh pr comment:*)"
