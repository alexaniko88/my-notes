name: my_notes
description: "A notes app supporting text, image, PDF, and voice notes with cross-device sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  firebase_core: 4.11.0
  firebase_auth: 6.5.1
  firebase_storage: 13.4.3
  cloud_firestore: 6.6.0
  google_sign_in: 7.2.0

  cupertino_icons: 1.0.9
  go_router: 17.2.3
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2
  equatable: 2.0.8
  uuid: 4.5.3
  gap: 3.0.1
  meta: 1.17.0
  permission_handler: 12.0.3
  record: 6.2.1
  path_provider: 2.1.6
  just_audio: 0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  riverpod_generator: 4.0.3
  build_runner: '>=2.4.0 <2.15.0'

flutter:
  generate: true
  uses-material-design: true
