name: my_notes
description: "A notes app supporting text, image, PDF, and voice notes with cross-device sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.9
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  equatable: ^2.0.8
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: '>=2.4.0 <2.15.0'

flutter:
  generate: true
  uses-material-design: true
